[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-ingestion-gate"
version = "0.1.0"
description = "Policy-driven CI gate that scans AI model supply chains and emits a CycloneDX ML-BOM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
aisentinel = "aisentinel.cli:app"

[tool.setuptools.packages.find]
include = ["aisentinel*"]